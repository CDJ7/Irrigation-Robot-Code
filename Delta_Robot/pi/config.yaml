# config.yaml -- settings for pi_camera_server.py (Pi vision only, never moves the robot)
# Paths that are not absolute are relative to this file's folder (~/Delta_Robot/pi on the Pi).

camera:
  device: /dev/video0
  # The stereo camera ("3D Global Shutter Camera", USB 32e4:9282) outputs ONE frame holding both eyes side by side.
  # Modes it advertises (frame size -> each eye): 640x240 -> 320x240, 1280x480 -> 640x480, 1600x600 -> 800x600,
  # 2560x720 -> 1280x720, 2560x800 -> 1280x800 (about 1 MP per eye). MJPG supports all of them (up to 120 fps);
  # YUYV only up to 15 fps at 1280x480. Run camera_check.py to measure what your Pi really delivers.
  # More pixels = finer depth but a slower pipeline. 1280x480 is the starting point.
  # NOTE: the stereo calibration is tied to this size -- re-run calibrate_stereo.py after changing it.
  width: 1280
  height: 480
  # YUYV = uncompressed video: it cannot have broken-JPEG damage. 15 fps is this camera's maximum in YUYV at 1280x480.
  # (MJPG gave broken frames while the lens caps were on / in the dark; with light it looked fine in a first test, but
  # YUYV is the safe default. Compare modes with camera_check.py.)
  fourcc: "YUYV"
  fps: 15               # asked frame rate. 0 = camera default
  buffer_size: 1        # keep V4L2's queue short so frames are fresh, not seconds old
  auto_exposure: 3      # 3 = auto (same as main_harvester.py). null = don't touch

stereo:
  # Written by calibrate_stereo.py. If the file is missing the server still runs, but
  # in UNCALIBRATED mode (no rectification, nominal numbers below) and it tells clients
  # so ("calibrated": false) -- the GUI must refuse to pick in that mode.
  calibration_file: calibration/stereo_calib.npz
  # Nominal values used ONLY when uncalibrated. Copied from main_harvester.py and NOT
  # verified (the baseline was never measured with a ruler).
  nominal_focal_px: 600.0
  nominal_baseline_mm: 60.0
  matcher: sgbm         # "sgbm" (better, smoother) or "bm" (faster, noisier)
  # How many pixels of horizontal shift the matcher searches. Must be a multiple of 16.
  # Nearest measurable distance = focal_px * baseline_mm / num_disparities.
  # (calibrate_stereo.py prints this number for you.) Bigger = can see closer, slower.
  num_disparities: 128
  min_disparity: 0
  block_size: 5         # odd number; bigger = smoother but blurrier at edges
  uniqueness_ratio: 10
  speckle_window: 100
  speckle_range: 2
  disp12_max_diff: 1
  pre_filter_cap: 31
  # Disparities below this (in pixels) are treated as "no depth" (too far / noise).
  min_valid_disparity: 1.0

depth:
  # Depth of a detection = MEDIAN disparity over the middle part of its box, ignoring holes.
  patch_fraction: 0.5   # use the central 50% (width and height) of the bounding box
  min_valid_fraction: 0.2   # need at least 20% of that patch to have valid disparity
  min_pixels: 9
  min_z_mm: 100.0       # readings outside this range are reported as null
  max_z_mm: 2000.0

detection:
  # OFF until ultralytics is installed (pip install ultralytics) and a strawberry model exists. With it off the server
  # still streams video + depth, and reports no detections. Set to true to turn YOLO on.
  enabled: false
  # Swap in a trained model by changing this one line, e.g. models/strawberry_ncnn_model
  model: yolov8n.pt     # STOCK model: no strawberry class -> automation must refuse it
  confidence: 0.3
  imgsz: 320
  max_detections: 20
  # Only detections whose class name is in this list are flagged "allowed": true.
  # The GUI may only pick allowed detections.
  allowed_classes: [strawberry]
  # true = never even report other classes (e.g. "person"). false = report all but flag them.
  report_only_allowed: false

network:
  tcp_host: 0.0.0.0
  tcp_port: 8485        # GUI client (camera_client.py)
  http_port: 5000       # browser MJPEG viewer, null = off
  jpeg_quality: 70
  send_timeout_s: 5.0   # a client that cannot take data for this long is dropped
  target_fps: 15        # processing is capped at this rate
  idle_fps: 2           # rate while nobody is watching (saves Pi CPU)

dataset:
  # Dataset capture: saves the left-eye grayscale image (exactly what YOLO sees) so you
  # can label it for training. Also switchable with:  --capture-dataset [DIR]
  enabled: false
  dir: dataset_images
  interval_s: 2.0
  max_images: 0         # 0 = unlimited
